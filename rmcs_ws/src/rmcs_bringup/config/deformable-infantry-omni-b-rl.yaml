rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::DeformableInfantryOmniB -> deformable_infantry
      - rmcs::rl::RlController -> rl_controller
      - rmcs::rl::RlDebugCommand -> rl_debug_command

      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::referee::Command -> referee_command
      - rmcs_core::referee::command::Interaction -> referee_interaction
      - rmcs_core::referee::command::interaction::Ui -> referee_ui
      - rmcs_core::controller::chassis::DeformableChassis -> chassis_controller
      - rmcs_core::controller::chassis::ChassisPowerController -> chassis_power_controller
      - rmcs_core::controller::chassis::DeformableOmniWheelController -> deformable_chassis_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
      
value_broadcaster:
  ros__parameters:
    forward_list:
      - /chassis/left_front_joint/control_torque  
      - /chassis/left_back_joint/control_torque
      - /chassis/right_back_joint/control_torque
      - /chassis/right_front_joint/control_torque
      - /chassis/left_front_joint/torque  
      - /chassis/left_back_joint/torque
      - /chassis/right_back_joint/torque
      - /chassis/right_front_joint/torque


deformable_infantry:
  ros__parameters:
    serial_filter_bottom_board: "AF-73B2-E8A1-A544-79ED-5BDA-D088-7F21-A6A6"
    serial_filter_top_board: "AF-C26A-0C9C-CF41-3E3C-1596-524B-7527-5744"
    chassis_radius: 0.2341741
    rod_length: 0.140
    yaw_motor_zero_point: 57900
    pitch_motor_zero_point: 56354

chassis_controller:
  ros__parameters:
    min_angle: 17.0
    max_angle: 75.0
    active_suspension_enable: false
    wireless_charging_offset_deg: 225.0
    wireless_charging_speed_limit: 0.6
    wireless_charging_angular_velocity_limit: 10.0

rl_controller:
  ros__parameters:
    rl_model_path: "models/policy_deformable_sps.onnx"  
    rl_inference_frequency: 100.0     
    rl_publish_network_io: true

    # 关节序与硬件/训练 DOF 一致：lf, lb, rb, rf（physical 角，rad）
    joint_names: [left_front_joint, left_back_joint, right_back_joint, right_front_joint]
    joint_base_path: "/chassis"
    position_pd_joints: [0, 1, 2, 3]
    position_group_angle_suffix: "/physical_angle"
    position_group_velocity_suffix: "/physical_velocity"
    rl_obs_size: 22                 
    rl_action_size: 4

    default_dof_pos: [1.3439, 1.3439, 1.3439, 1.3439]
    dof_pos_limits_lower: [0.0873, 0.0873, 0.0873, 0.0873]
    dof_pos_limits_upper: [1.3439, 1.3439, 1.3439, 1.3439]
    position_action_scale: 0.25
    position_kp: 200.0               
    position_kd: 4.0
    position_torque_max: 20.0       

    obs_height_scale: 5.0
    obs_ang_vel_scale: 0.5
    obs_gravity_scale: 1.0
    obs_dof_pos_scale: 1.0
    obs_dof_vel_scale: 0.1
    clip_observations: 100.0
    clip_actions: 100.0

    motion_linear_x_min: 0.0
    motion_linear_x_max: 0.0
    motion_angular_z_min: 0.0
    motion_angular_z_max: 0.0
    command_height_min: 0.05
    command_height_max: 0.17
    default_command_height: 0.132

    auto_enter_rl: false              
    prepare_dof_pos: [1.3439, 1.3439, 1.3439, 1.3439] 
    prepare_kp: 80.0
    prepare_kd: 2.0
    prepare_max_velocity: 1.0     
    prepare_reach_threshold: 0.02

rl_debug_command:
  ros__parameters:
    command_base: "/chassis"

deformable_chassis_controller:
  ros__parameters:
    mass: 25.5
    moment_of_inertia: 1.0
    wheel_radius: 0.075
    friction_coefficient: 6.6
    k1: 2.958580e+00
    k2: 3.082190e-03
    no_load_power: 11.37