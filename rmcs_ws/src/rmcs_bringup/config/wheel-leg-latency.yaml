rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLeg -> wheel_leg
      - rmcs_core::controller::identification::WheelLegLatencyProbeController -> latency_probe
      - rmcs_core::debug::ValueCollector -> value_collector

wheel_leg:
  ros__parameters:
    serial_filter_bottom_board: "AF-CBB3-7053-32C5-F3B5-B460-A786-DA9A-1FF1"
    serial_filter_top_board: "AF-46C7-7B12-9364-64F6-D95A-E4F4-9299-1B75"
    yaw_motor_zero_point: 58379
    pitch_motor_zero_point: 12637
    feedback_timeout_s: 0.0
    dm_master_ids: [1, 2, 1, 2]
    dm_mit_position_max: [12.5, 12.5, 12.5, 12.5]
    dm_mit_velocity_max: [45.0, 45.0, 45.0, 45.0]
    dm_mit_torque_max: [54.0, 54.0, 54.0, 54.0]
    dm_control_torque_max: [40.0, 40.0, 40.0, 40.0]
    latency_trace_path: /tmp/wheel_leg_latency_events.csv

latency_probe:
  ros__parameters:
    axis: left_wheel
    probe_amplitude_nm: 0.3
    bit_duration_s: 0.01
    segment_duration_s: 10.0
    joint_kp: 160.0
    joint_kd: 0.08
    torque_limit_nm: 4.5
    joint_excursion_limit_rad: 0.1
    speed_limit_rad_s: 25.0
    wheel_velocity_rad_s: 0.0

value_collector:
  ros__parameters:
    csv_path: /tmp/wheel_leg_latency_control.csv
    write_interval: 1
    flush_interval: 1000
    strict_signals: true
    signals:
      - /predefined/update_count
      - /wheel_leg/latency/axis
      - /wheel_leg/latency/stage
      - /wheel_leg/latency/validation
      - /wheel_leg/latency/active
      - /wheel_leg/latency/completed
      - /wheel_leg/latency/fault
      - /wheel_leg/latency/run_id
      - /wheel_leg/latency/probe_nm
      - /wheel_leg/latency/saturated
      - /wheel_leg/latency/preclip_nm
      - /wheel_leg/latency/control_steady_ns
      - /wheel_leg/latency/control_end_steady_ns
      - /wheel_leg/latency/trace_dropped
      - /wheel_leg/latency/trace_failed
      - /wheel_leg/dr16_fresh
      - /wheel_leg/dm_control_ready
      - /wheel_leg/enable_request
