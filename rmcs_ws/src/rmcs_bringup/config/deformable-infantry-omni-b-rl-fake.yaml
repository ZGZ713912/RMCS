# ============================================================================
# deformable-infantry-omni-b-rl-fake.yaml — RL 部署管线测试（无硬件）
#
# 用 RlFakePlant 仿真桩替代真实硬件，验证完整部署链路：
#   模型加载（合同校验）→ 接口绑定 → FSM（INIT/IDLE/PREPARE/RL）→ 观测构建 → PD → 力矩
# 组件与 deformable-infantry-omni-b-rl.yaml 完全同构（同一套 rl_controller 参数）。
#
# 运行：
#   source install/setup.bash
#   ros2 run rmcs_executor rmcs_executor --ros-args \
#       --params-file src/rmcs_bringup/config/deformable-infantry-omni-b-rl-fake.yaml
# 观测：
#   ros2 topic echo /chassis/fake/state            # FSM 状态
#   ros2 topic echo /chassis/fake/observation      # 22 维观测（合同布局）
#   ros2 topic echo /chassis/fake/torques          # 4 关节力矩
# 驱动（另一个终端）：
#   ros2 topic pub -1 /chassis/debug/command std_msgs/msg/Float64MultiArray "{data: [0,0,0.132,2]}"
#   ros2 topic pub -1 /chassis/debug/command std_msgs/msg/Float64MultiArray "{data: [0,0,0.132,3]}"
#   ros2 topic pub -1 /chassis/debug/reset std_msgs/msg/Bool "{data: true}"
# ============================================================================

rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs::rl::RlFakePlant -> rl_fake_plant
      - rmcs::rl::RlController -> rl_controller
      - rmcs::rl::RlDebugCommand -> rl_debug_command

rl_fake_plant:
  ros__parameters:
    joint_base_path: "/chassis"
    joint_names: [left_front_joint, left_back_joint, right_back_joint, right_front_joint]
    angle_suffix: "/physical_angle"
    velocity_suffix: "/physical_velocity"
    fake_dynamics: true
    fake_inertia: 0.05
    fake_damping: 2.0
    fake_joint_angles: [0.0, 0.0, 0.0, 0.0]
    fake_imu_roll_rate: 0.0
    fake_imu_pitch_rate: 0.0

rl_controller:
  ros__parameters:
    # ---- 模型与推理 ----
    rl_model_path: "models/policy.onnx"   # synthetic 零动作策略（obs[1,22] -> actions[1,4]）
    rl_inference_frequency: 100.0
    rl_publish_network_io: true

    # ---- 机器人描述（与真实配置一致）----
    joint_names: [left_front_joint, left_back_joint, right_back_joint, right_front_joint]
    joint_base_path: "/chassis"
    position_pd_joints: [0, 1, 2, 3]
    # velocity_pd_joints 省略 = 默认空（rcl 参数文件不支持空列表，[] 会落盘为
    # PARAMETER_NOT_SET 导致参数读取异常；代码默认值即为空组）
    position_group_angle_suffix: "/physical_angle"
    position_group_velocity_suffix: "/physical_velocity"
    rl_obs_size: 22
    rl_action_size: 4

    # ---- 策略合同 ----
    default_dof_pos: [0.3, 0.3, 0.3, 0.3]     # 测试用站立位姿（真机需标定）
    dof_pos_limits_lower: [0.0, 0.0, 0.0, 0.0]
    dof_pos_limits_upper: [1.05, 1.05, 1.05, 1.05]
    position_action_scale: 0.25
    position_kp: 200.0
    position_kd: 4.0
    position_torque_max: 20.0

    # ---- 观测缩放 ----
    obs_height_scale: 5.0
    obs_ang_vel_scale: 0.5
    obs_gravity_scale: 1.0
    obs_dof_pos_scale: 1.0
    obs_dof_vel_scale: 0.1
    clip_observations: 100.0
    clip_actions: 100.0

    # ---- 指令 ----
    motion_linear_x_min: 0.0
    motion_linear_x_max: 0.0
    motion_angular_z_min: 0.0
    motion_angular_z_max: 0.0
    command_height_min: 0.05
    command_height_max: 0.17
    default_command_height: 0.132

    # ---- FSM / PREPARE ----
    auto_enter_rl: false
    prepare_dof_pos: [0.5, 0.5, 0.5, 0.5]     # 测试：PREPARE 驱动关节 0.3 -> 0.5
    prepare_kp: 80.0
    prepare_kd: 2.0
    prepare_max_velocity: 1.0
    prepare_reach_threshold: 0.02

rl_debug_command:
  ros__parameters:
    command_base: "/chassis"
