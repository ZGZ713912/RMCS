# deformable 同款重力前馈：gain * sin(world_pitch - phase)，world_pitch 来自云台 IMU。
# 中/上仅输出 pitch 重力补偿；其余档位清零。无 PID、无标定、无扫频。
# 固定支撑机体；腿失能，轮/射击零力矩。退出或故障清零后 pitch 可能下垂。
# 本补偿输出层不做限幅、软限位、速度或反馈检查；驱动层原有行为不变。
# 修改参数后重启：ros2 launch rmcs_bringup rmcs.launch.py robot:=wheel-leg-gimbal-torque-sweep
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLegDualBoard -> wheel_leg
      - rmcs_core::controller::gimbal::PitchGravityFeedforward -> pitch_gravity_ff
      - rmcs_core::controller::identification::GimbalTorqueSweepController -> gimbal_torque_sweep
      - rmcs_core::debug::ValueCollector -> value_collector
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

wheel_leg:
  ros__parameters:
    serial_filter_bottom_board: "AF-CBB3-7053-32C5-F3B5-B460-A786-DA9A-1FF1"
    serial_filter_top_board: "AF-46C7-7B12-9364-64F6-D95A-E4F4-9299-1B75"
    yaw_motor_zero_point: 58379
    pitch_motor_zero_point: 12637
    gimbal_only: true
    dm_master_ids: [1, 2, 1, 2]
    dm_mit_position_max: [12.5, 12.5, 12.5, 12.5]
    dm_mit_velocity_max: [45.0, 45.0, 45.0, 45.0]
    dm_mit_torque_max: [54.0, 54.0, 54.0, 54.0]
    dm_control_torque_max: [40.0, 40.0, 40.0, 40.0]
    feedback_timeout_s: 0.04

pitch_gravity_ff:
  ros__parameters:
    pitch_gravity_ff_gain: 0.9 # Nm，实车手调结果
    pitch_gravity_ff_phase: 0.75 # rad，实车手调结果

value_collector:
  ros__parameters:
    csv_path: "/tmp/wheel_leg_gimbal_gravity_<timestamp>.csv"
    write_interval: 1
    flush_interval: 1000
    strict_signals: true
    signals:
      - /gimbal/torque_sweep/state
      - /gimbal/torque_sweep/enabled
      - /gimbal/pitch/angle
      - /gimbal/pitch/velocity
      - /gimbal/pitch/velocity_imu
      - /gimbal/pitch/torque_ff
      - /gimbal/pitch/control_torque
      - /gimbal/pitch/torque
      - /gimbal/pitch/temperature
      - /gimbal/yaw/control_torque
      - /wheel_leg/dr16_fresh
      - /chassis/reset_count

value_broadcaster:
  ros__parameters:
    forward_list:
      - /gimbal/torque_sweep/state
      - /gimbal/torque_sweep/enabled
      - /gimbal/pitch/torque_ff
      - /gimbal/pitch/control_torque
      - /gimbal/yaw/control_torque
